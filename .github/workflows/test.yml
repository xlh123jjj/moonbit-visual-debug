name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wasm:
    name: wasm-gc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        run: |
          moon version --all
          moon update

      - name: Format
        run: moon fmt --check

      - name: Check
        run: moon check --target wasm-gc --deny-warn

      - name: Test
        run: moon test --target wasm-gc --deny-warn

      - name: Generated interfaces
        run: |
          moon info
          git diff --exit-code

  native:
    name: native and all-target smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          moon version --all
          moon update

      - name: Native check and test
        run: |
          moon check --target native --deny-warn
          moon test --target native --deny-warn

      - name: All target check
        run: moon check --target all --deny-warn
